<svg xmlns="http://www.w3.org/2000/svg" width="880" height="426" viewBox="0 0 880 426" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">PasarBench: four results</title>
<desc id="d">Naming the tools: 44% to 80% of conversations passed (38 tasks better, 4 worse). Claim guardrail: 5 to 0 conversations of 96 told the customer an action happened that never did (p = 0.06). Fine-tune: +2.3 to +0.3 points over the base model once the checker was fixed (p = 0.84); API reference +4.0 to −6.6 (p = 0.004), at best −4.7. Languages: Indonesian −1.3; Malay +3.8; Singlish +4.6; Thai +7.5; Vietnamese −1.2; Chinese (MY) +2.5; Chinese (SG) +1.5 points against English, every p ≥ 0.12.</desc>
